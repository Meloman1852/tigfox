<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дякуємо за замовлення! 🎄</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #d9ecff, #ffffff);
            text-align: center;
            padding-top: 60px;
            overflow-x: hidden;
        }

        .thank-you-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.15);
            position: relative;
            z-index: 2;
        }

        h2 {
            font-size: 32px;
            color: #d62828;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        .return-button {
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #2fa74d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .return-button:hover {
            background-color: #1d8038;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 20px;
            opacity: 0.9;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(110vh); }
        }
    </style>

</head>
<body>

    <div class="thank-you-box">
        <h2>🎄 Дякуємо за замовлення! 🎁</h2>
        <p>Ваше новорічне замовлення успішно отримано!  
        Скоро ми з вами звʼяжемося. Гарного передсвяткового настрою!</p>

        <p>Слава Україні 🇺🇦</p>

        <button class="return-button" onclick="goBack()">Повернутися на сайт</button>

        <script>
            function goBack() {
                window.location.href = "https://meloman1852.github.io/tigfox/";
            }
        </script>
    </div>

    <!-- Сніжинки -->
    <script>
    const snowCount = 40;

    for (let i = 0; i < snowCount; i++) {
        let snow = document.createElement("div");
        snow.className = "snowflake";
        snow.innerHTML = "❄";

        snow.style.left = Math.random() * 100 + "vw";
        snow.style.animationDuration = 3 + Math.random() * 7 + "s";
        snow.style.fontSize = 12 + Math.random() * 20 + "px";
        snow.style.animationDelay = Math.random() * 5 + "s";

        document.body.appendChild(snow);
    }
    </script>

</body>
</html>
